name: Sideout
options:
  bundleIdPrefix: com.krogerjt
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: L67J56VPBG
targets:
  Sideout:
    type: application
    platform: iOS
    sources:
      - ios/App
      - ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krogerjt.sideout
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
    # SIDEOUT_SERVER_URL comes from ios/Sideout.xcconfig, which reads the private, git-ignored ios/Local.xcconfig.
    configFiles:
      Debug: ios/Sideout.xcconfig
      Release: ios/Sideout.xcconfig
    info:
      path: ios/Config/App-Info.plist
      properties:
        CFBundleDisplayName: Sideout
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        SideoutServerURL: $(SIDEOUT_SERVER_URL)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.krogerjt.sideout
            CFBundleURLSchemes: [sideout]
    entitlements:
      path: ios/Config/Sideout.entitlements
      properties:
        aps-environment: development
    dependencies:
      - target: SideoutActivity
        embed: true
  SideoutActivity:
    type: app-extension
    platform: iOS
    sources:
      - ios/Widget
      - ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.krogerjt.sideout.activity
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        TARGETED_DEVICE_FAMILY: '1'
    info:
      path: ios/Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Sideout Live Score
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  SideoutTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ios/Tests]
    dependencies:
      - target: Sideout
schemes:
  Sideout:
    build:
      targets:
        Sideout: all
        SideoutActivity: all
    test:
      targets: [SideoutTests]
