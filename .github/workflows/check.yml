name: Check Sideout
on: [push, pull_request]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build app, extension, and tests without signing
        run: xcodebuild build-for-testing -project Sideout.xcodeproj -scheme Sideout -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      SIDEOUT_SERVER_URL: ${{ vars.SIDEOUT_SERVER_URL || secrets.SIDEOUT_SERVER_URL }}
      SIDEOUT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/sideout.jks"
            echo "SIDEOUT_KEYSTORE_PATH=$RUNNER_TEMP/sideout.jks" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key."
          fi
      - run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk sideout.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sideout-android
          path: android/sideout.apk
      # Each build of main replaces the APK on the "android-latest" pre-release, so phones can download it directly.
      - name: Publish the APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIDEOUT_KEYSTORE_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Sideout for Android" --notes "The latest Android build of Sideout. Download sideout.apk on your phone and open it to install or update."
          gh release upload android-latest sideout.apk --clobber
