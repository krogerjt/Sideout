name: Upload to TestFlight
# Run from the Actions tab (or `gh workflow run testflight.yml`). Needs these repository secrets:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8  App Store Connect API key with the Admin role (contents of the .p8)
#   SIDEOUT_SERVER_URL                     e.g. https://your-server.example
on: workflow_dispatch
concurrency: testflight
jobs:
  upload:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Configure server address and API key
        env:
          SERVER_URL: ${{ secrets.SIDEOUT_SERVER_URL }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$SERVER_URL" && test -n "$KEY_P8" && test -n "$ASC_KEY_ID" && test -n "$ASC_ISSUER_ID" || { echo "::error::Add the TestFlight secrets listed at the top of this workflow."; exit 1; }
          # xcconfig treats // as a comment, hence the $() escape.
          echo "SIDEOUT_SERVER_URL = ${SERVER_URL/:\/\//:/\$()/}" > ios/Local.xcconfig
          echo "$KEY_P8" > "$RUNNER_TEMP/asc.p8"
      - run: cd ios && xcodegen generate
      - name: Archive
        run: |
          xcodebuild archive -project ios/Sideout.xcodeproj -scheme Sideout -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Sideout.xcarchive" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Upload
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>L67J56VPBG</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Sideout.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - if: always()
        run: rm -f "$RUNNER_TEMP/asc.p8" ios/Local.xcconfig
